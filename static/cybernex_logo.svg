<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#111726" />
      <stop offset="60%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Neon Glow Cyan -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0051FF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <!-- Stroke Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="850" rx="32" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow in Center -->
  <circle cx="400" cy="360" r="220" fill="#00f0ff" opacity="0.08" filter="url(#glow)" />

  <!-- MAIN EMBLEM (X Symbol) -->
  <g id="logo-mark" transform="translate(400, 350)">

    <!-- Outer Structural Hexagon Guide Accents -->
    <g opacity="0.3" stroke="#00d2ff" stroke-width="1.5" fill="none">
      <circle cx="0" cy="0" r="210" stroke-dasharray="8 12" />
      <circle cx="0" cy="0" r="160" stroke-opacity="0.2" />
    </g>

    <!-- Diagonal Left-to-Right Stem (Outer Outline) -->
    <path d="M -150 -190 L -60 -190 L 150 190 L 60 190 Z" 
          fill="#0c192c" stroke="url(#cyanGrad)" stroke-width="6" 
          stroke-linejoin="round" filter="url(#glow)" />

    <!-- Diagonal Right-to-Left Stem (Outer Outline) -->
    <path d="M 150 -190 L 60 -190 L -150 190 L -60 190 Z" 
          fill="#0c192c" stroke="url(#cyanGrad)" stroke-width="6" 
          stroke-linejoin="round" filter="url(#glow)" />

    <!-- Circuit Inlays & Traces: Left Arm -->
    <g stroke="url(#cyanGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
      <!-- Top Left Branch -->
      <path d="M -125 -165 L -85 -165 L -35 -75" />
      <path d="M -100 -140 L -75 -140 L -45 -85" />
      
      <!-- Top Right Branch -->
      <path d="M 125 -165 L 85 -165 L 35 -75" />
      <path d="M 100 -140 L 75 -140 L 45 -85" />

      <!-- Bottom Left Branch -->
      <path d="M -125 165 L -85 165 L -35 75" />
      <path d="M -100 140 L -75 140 L -45 85" />

      <!-- Bottom Right Branch -->
      <path d="M 125 165 L 85 165 L 35 75" />
      <path d="M 100 140 L 75 140 L 45 85" />

      <!-- Center Cross Traces -->
      <line x1="-35" y1="-75" x2="35" y2="75" stroke-dasharray="10 6" />
      <line x1="35" y1="-75" x2="-35" y2="75" stroke-dasharray="10 6" />
    </g>

    <!-- Circuit Connection Nodes (Pads & Hexagons) -->
    <g fill="#00F0FF" filter="url(#softGlow)">
      <!-- Top Left Nodes -->
      <circle cx="-125" cy="-165" r="5.5" />
      <circle cx="-100" cy="-140" r="4.5" />
      <!-- Top Right Nodes -->
      <circle cx="125" cy="-165" r="5.5" />
      <circle cx="100" cy="-140" r="4.5" />
      <!-- Bottom Left Nodes -->
      <circle cx="-125" cy="165" r="5.5" />
      <circle cx="-100" cy="140" r="4.5" />
      <!-- Bottom Right Nodes -->
      <circle cx="125" cy="165" r="5.5" />
      <circle cx="100" cy="140" r="4.5" />

      <!-- Inner Branch Nodes -->
      <circle cx="-70" cy="-35" r="3.5" />
      <circle cx="70" cy="-35" r="3.5" />
      <circle cx="-70" cy="35" r="3.5" />
      <circle cx="70" cy="35" r="3.5" />
    </g>

    <!-- Central Nexus Core -->
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" 
             fill="#030c17" stroke="#00F0FF" stroke-width="3" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" filter="url(#glow)" />
  </g>

  <!-- TYPOGRAPHY: CyberneX -->
  <g transform="translate(400, 680)">
    <text text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-weight="800" 
          font-size="64" 
          letter-spacing="12" 
          fill="#FFFFFF" 
          filter="url(#softGlow)">
      CYBERNE<tspan fill="#00F0FF">X</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="48" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-weight="600" 
          font-size="14" 
          letter-spacing="10" 
          fill="#5a7a9e">
      INNOVATION &#8226; INTELLIGENCE &#8226; SECURITY
    </text>
  </g>
</svg>
